# GitHub Actions: Deploy prady-website to Vercel
# Deploys preview on every PR, production on every push to main.
# No build step needed — pure static HTML/JS/CSS.

name: Deploy Website

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      # Secrets needed (repo Settings → Secrets and variables → Actions):
      #   VERCEL_TOKEN  — from https://vercel.com/account/tokens
      #   VERCEL_ORG_ID — from .vercel/project.json after running `vercel link` once locally
      #   VERCEL_PROJECT_ID — same file

      - name: Check for Vercel credentials
        id: check_token
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "VERCEL_TOKEN secret is not set yet. Skipping workflow deployment."
            echo "To enable automatic deployments, connect https://github.com/technopradyumn/prady-website directly on https://vercel.com/new"
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Vercel (production)
        if: github.ref == 'refs/heads/main' && steps.check_token.outputs.has_token == 'true'
        run: vercel --prod --token "${{ secrets.VERCEL_TOKEN }}" --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (preview)
        if: github.ref != 'refs/heads/main' && steps.check_token.outputs.has_token == 'true'
        run: vercel --token "${{ secrets.VERCEL_TOKEN }}" --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
