<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prady Documentation (v1.0.0 GA) — MDN Web Docs Reference</title>
  <meta name="description" content="Official MDN-style technical documentation and reference for the Prady Programming Language (v1.0.0 GA). Complete guide to all 28 data structures, switch, foreach, lambdas, and architecture-as-code.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="icon.png">
</head>
<body>

  <!-- Classical MDN Global Navigation Header -->
  <header class="mdn-header">
    <div class="header-left">
      <a href="#guide-getting-started" class="brand-logo" id="header-brand-logo">
        <span class="brand-tag">.pr</span>
        <span>Prady Docs</span>
      </a>
      <span class="version-pill">v1.0.0 GA</span>
    </div>

    <!-- Search box with '/' shortcut -->
    <div class="header-search">
      <input type="text" id="search-input" placeholder="Search documentation... (Press '/' to focus)" autocomplete="off">
      <span class="search-shortcut">/</span>
    </div>

    <!-- Navigation actions & Theme toggle -->
    <div class="header-right">
      <button class="nav-tab-btn active" id="tab-btn-docs">Documentation</button>
      <button class="nav-tab-btn" id="tab-btn-playground">Interactive Playground</button>
      <button class="btn-icon" id="theme-toggle-btn" title="Toggle Light/Dark Theme">Theme</button>
      <a href="https://github.com/technopradyumn/prady" target="_blank" rel="noopener" class="btn btn-sm">GitHub</a>
    </div>
  </header>

  <!-- Main Body Layout -->
  <div class="mdn-layout">
    
    <!-- Left Navigation Sidebar -->
    <aside class="mdn-sidebar" aria-label="Documentation Navigation">
      <nav id="sidebar-navigation">
        <!-- Injected dynamically by TypeScript app -->
      </nav>
    </aside>

    <!-- Main Content: Documentation Article -->
    <main class="mdn-content-area" id="doc-article-container">
      <!-- Injected dynamically by TypeScript app -->
    </main>

    <!-- Alternative View: Interactive Playground -->
    <div id="playground-view" class="hidden">
      <div class="pg-toolbar">
        <div class="pg-toolbar-left">
          <span class="pg-title">Prady Live Compiler & Playground (v1.0.0 GA)</span>
        </div>
        <div class="pg-toolbar-right">
          <button class="btn btn-sm" id="pg-reset-btn">Reset to Example</button>
          <button class="btn btn-primary btn-sm" id="pg-run-btn">Run Code (Ctrl+Enter)</button>
        </div>
      </div>
      <div class="pg-split-container">
        <div class="pg-editor-pane">
          <div class="pane-label">
            <span>Editor (Prady v1.0.0)</span>
            <span>UTF-8</span>
          </div>
          <textarea id="playground-editor" spellcheck="false">// Welcome to Prady v1.0.0 GA Interactive Playground
fn main() {
    print("Welcome to Prady v1.0.0 GA!");

    // 1. Array with Higher-Order Methods
    let numbers = [1, 2, 3, 4, 5, 6];
    let evens = numbers.filter(fn(x: Int, i: Int) -> Bool {
        return x % 2 == 0;
    });
    print("Evens: " + evens.join(", "));

    let doubled = evens.map(fn(x: Int, i: Int) -> Int {
        return x * 10;
    });
    print("Doubled evens: " + doubled.join(", "));

    // 2. TypeScript-Style Switch Statement
    let status = 200;
    switch (status) {
        case 200:
            print("Status 200: OK - Request succeeded.");
            break;
        case 404:
            print("Status 404: Not Found.");
            break;
        default:
            print("Unknown status code.");
    }

    // 3. Data Structures: Stack & LRU Cache
    let s = Stack();
    s.push(10);
    s.push(20);
    s.push(30);
    print("Stack peek: " + s.peek());
    print("Stack pop: " + s.pop());

    let cache = LRUCache(2);
    cache.put("user_1", "Alice");
    cache.put("user_2", "Bob");
    print("LRU Cache get user_1: " + cache.get("user_1"));

    // 4. For-of Loop
    let fruits = ["Apple", "Orange", "Mango"];
    for (let f of fruits) {
        print("Fruit: " + f);
    }
}
</textarea>
        </div>
        <div class="pg-output-pane">
          <div class="pane-label">
            <span>Terminal Output</span>
            <span id="playground-timing">Ready</span>
          </div>
          <div class="stdout-output" id="playground-output">Click "Run Code" above to execute.</div>
        </div>
      </div>
    </div>

  </div>

  <!-- Pure TypeScript compiled bundle -->
  <script type="module" src="./dist/app.js"></script>
</body>
</html>
