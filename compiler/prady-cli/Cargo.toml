[package]
name = "prady-cli"
version = "0.1.0"
edition = "2021"
authors = ["Prady Team"]
description = "Command-line interface and developer driver for the Prady language"

[[bin]]
name = "prady"
path = "src/main.rs"

[dependencies]
prady-diagnostics = { path = "../prady-diagnostics" }
prady-ast = { path = "../prady-ast" }
prady-lexer = { path = "../prady-lexer" }
prady-parser = { path = "../prady-parser" }
