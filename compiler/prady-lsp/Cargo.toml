[package]
name = "prady-lsp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "prady-lsp"
path = "src/main.rs"

[dependencies]
prady-diagnostics = { path = "../prady-diagnostics" }
prady-ast         = { path = "../prady-ast" }
prady-lexer       = { path = "../prady-lexer" }
prady-parser      = { path = "../prady-parser" }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
